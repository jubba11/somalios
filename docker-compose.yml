services:
  postgres:
    image: postgres:17-alpine
    container_name: somalios_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-somalios_db}
      POSTGRES_USER: ${POSTGRES_USER:-somalios_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-somalios_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-somalios_user} -d ${POSTGRES_DB:-somalios_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
